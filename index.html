<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Cut</title><link rel="stylesheet" href="style.css"></head><body>
<header><b>Cut</b>
<label class="btn">Import<input id="file" type="file" accept="video/*,audio/*,.m4a,.mp3,.wav,.aac" multiple hidden></label>
<button id="undo" class="btn" title="Undo">↶</button><button id="redo" class="btn" title="Redo">↷</button>
<button id="exportBtn" class="btn pri">Export video</button><button id="wavBtn" class="btn">Audio WAV</button><button id="newBtn" class="btn">New</button></header>
<main>
<div id="stage"><canvas id="cv" width="1280" height="720"></canvas><div id="empty">Import a video or audio file to start</div></div>
<div class="row"><button id="play" class="btn">▶</button><span id="time">0:00.000</span><div id="meter"><div id="mbar"></div><span id="clipw">CLIP</span></div></div>
<div class="row"><button id="split" class="btn">Split</button><button id="del" class="btn danger">Delete</button>
<span class="grp" id="nudgeLbl">Nudge playhead</span><button class="btn nd" data-d="-0.0333">−1f</button><button class="btn nd" data-d="-0.01">−10ms</button><button class="btn nd" data-d="0.01">+10ms</button><button class="btn nd" data-d="0.0333">+1f</button></div>
<div class="row"><span>Zoom</span><input id="zoom" type="range" min="0" max="100" value="35" style="flex:1"></div>
<div id="tlwrap"><div id="tl"></div></div>
<section id="panel"></section>
<section><h3>Tracks</h3><div id="mixer"></div></section>
<section><h3>Captions <button id="addCap" class="btn">+ Add at playhead</button></h3><div id="caps"></div></section>
<div id="status"></div></main><script src="app.js"></script></body></html>
