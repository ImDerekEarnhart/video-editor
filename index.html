<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Cut</title><link rel="stylesheet" href="style.css"></head><body>
<header><b>Cut</b><label class="btn">Import<input id="file" type="file" accept="video/*" multiple hidden></label><button id="exportBtn" class="btn pri">Export</button></header>
<main>
<div id="stage"><canvas id="cv" width="1280" height="720"></canvas><div id="empty">Import a video to start</div></div>
<div class="row"><button id="play" class="btn">▶</button><span id="time">0:00.0 / 0:00.0</span><button id="split" class="btn">Split</button></div>
<input id="scrub" type="range" min="0" max="0" step="0.01" value="0">
<div id="timeline"></div>
<section id="clipPanel" hidden><h3>Clip <span id="clipNo"></span></h3>
<label>Start <input id="cStart" type="number" step="0.1"></label><label>End <input id="cEnd" type="number" step="0.1"></label>
<div class="row"><button id="cLeft" class="btn">◀ Move</button><button id="cRight" class="btn">Move ▶</button><button id="cDel" class="btn danger">Delete</button></div>
<h3>Transition to next clip</h3><label><select id="tType"><option value="none">None</option><option value="crossfade">Crossfade</option><option value="fadeblack">Fade through black</option><option value="slide">Slide</option></select></label>
<label>Duration <input id="tDur" type="number" step="0.1" min="0.1" value="1"> s</label></section>
<section><h3>Captions <button id="addCap" class="btn">+ Add at playhead</button></h3><div id="caps"></div></section>
<div id="status"></div></main><script src="app.js"></script></body></html>
